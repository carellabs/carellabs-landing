# Actualizaciones de dependencias. Los títulos de los PR (prefijo + "bump ...")
# tienen que pasar la política de PR (.github/scripts/pr-policy.mjs): por eso el
# prefijo es un commit convencional. Las etiquetas deben existir en el repo
# (se crean en .claude/skills/carellabs-github/references/github-setup.md).
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # `astro check` (@astrojs/check) no soporta TypeScript 7. Quitar cuando lo soporte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:chore"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:chore"]
