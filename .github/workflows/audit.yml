name: Audit

# Auditoría completa de dependencias (producción y desarrollo). NO es un check
# obligatorio de los PR (el obligatorio solo audita producción, en ci.yml): una
# alerta nueva en una herramienta de desarrollo no debe bloquear la fusión de
# cambios que no tienen nada que ver. Si falla, GitHub avisa por correo.
on:
  schedule:
    - cron: "17 6 * * 1" # lunes, 06:17 UTC (fuera de la hora en punto, la de más carga)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm audit --audit-level=high
