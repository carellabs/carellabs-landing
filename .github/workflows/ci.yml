name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# En un PR, un push nuevo a la misma rama cancela la ejecución anterior.
# En `main` cada commit tiene su propio grupo (por SHA): con un grupo compartido
# GitHub cancela igualmente la ejecución *pendiente* aunque `cancel-in-progress`
# sea false, y tres fusiones seguidas dejarían el commit intermedio sin CI.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo dependencias de producción: lo que llega al sitio publicado. Las de
      # desarrollo se vigilan en .github/workflows/audit.yml (no bloquea los PR).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # test-results/ guarda trazas y capturas de los tests fallidos. Los archivos
      # ocultos (como .last-run.json) no se suben: include-hidden-files es false.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
